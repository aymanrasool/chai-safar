    <rect x="230" y="760" width="200" height="130" fill="url(#win)" opacity="0.9"/>
    <rect x="500" y="760" width="230" height="220" fill="url(#win)" opacity="0.75"/>
    <rect x="160" y="700" width="18" height="290" fill="#120804"/>
    <rect x="782" y="700" width="18" height="290" fill="#120804"/>
    <!-- sign board -->
    <rect x="300" y="590" width="360" height="56" rx="4" fill="#7a3f1d"/>
    <text x="480" y="628" fill="#f5ede1" font-family="Georgia, serif" font-size="28" text-anchor="middle" letter-spacing="8">CHAI · DHABA</text>
    <!-- figures at the counter -->
    <g fill="#120804">
      <circle cx="330" cy="800" r="18"/><path d="M300 890 Q330 812 360 890Z"/>
      <circle cx="600" cy="815" r="20"/><path d="M566 980 L572 860 Q600 832 628 860 L634 980Z"/>
    </g>
