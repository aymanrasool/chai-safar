<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMax slice">
  <defs>
    <radialGradient id="bulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d0"/>
      <stop offset="0.3" stop-color="#ffc55e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf7a"/>
      <stop offset="1" stop-color="#c8641f"/>
    </linearGradient>
  </defs>
  <!-- neem tree -->
  <g fill="#160a06">
    <rect x="1350" y="640" width="26" height="320"/>
    <ellipse cx="1360" cy="600" rx="190" ry="120"/>
    <ellipse cx="1250" cy="660" rx="110" ry="70"/>
    <ellipse cx="1470" cy="650" rx="120" ry="80"/>
  </g>
  <!-- dhaba shack -->
  <g>
    <rect x="160" y="700" width="640" height="280" fill="#1c0d08"/>
    <path d="M110 705 L850 705 L800 650 L160 640Z" fill="#2a140c"/>
    <path d="M110 705 L850 705" stroke="#5b2f1c" stroke-width="6"/>
    <g stroke="#3b1d12" stroke-width="3">
      <path d="M200 642 L180 705"/><path d="M300 643 L285 705"/><path d="M400 644 L390 705"/>
      <path d="M500 645 L495 705"/><path d="M600 646 L600 705"/><path d="M700 648 L705 705"/>
