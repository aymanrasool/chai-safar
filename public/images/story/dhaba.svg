  <!-- string lights -->
  <path d="M60 560 Q420 660 860 590 Q1100 560 1300 620" fill="none" stroke="#120804" stroke-width="3"/>
  <g>
    <circle cx="120" cy="582" r="26" fill="url(#bulb)"/><circle cx="220" cy="606" r="26" fill="url(#bulb)"/>
    <circle cx="330" cy="624" r="26" fill="url(#bulb)"/><circle cx="440" cy="632" r="26" fill="url(#bulb)"/>
    <circle cx="560" cy="628" r="26" fill="url(#bulb)"/><circle cx="680" cy="614" r="26" fill="url(#bulb)"/>
    <circle cx="800" cy="598" r="26" fill="url(#bulb)"/><circle cx="920" cy="582" r="26" fill="url(#bulb)"/>
    <circle cx="1040" cy="578" r="26" fill="url(#bulb)"/><circle cx="1160" cy="590" r="26" fill="url(#bulb)"/>
    <circle cx="1260" cy="610" r="26" fill="url(#bulb)"/>
  </g>
  <rect x="0" y="975" width="1600" height="125" fill="#140906"/>
